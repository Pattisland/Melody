Melody
# 不注明是重制版，不过的确是借这个名字重新做的一个版本，如果有需要，我会提供已经归档的源码作为技术参考（而非全盘照搬）
- 主要需求
  - 将网页托管到Github Page，提供免费的、便捷的在线音乐搜索、播放、收藏和下载，不提供内容，通过一定手段获取资源（检索Github上相关的项目，借鉴它们的音乐渠道来为此应用提供源）
  - 同时适用于桌面端和移动端，严格遵照Material Design 3，实现莫奈取色（用户可自定义，也有根据封面取色的可选项）和深浅色系统。
    - 除多项列表等需要枚举数据的情形，尽量不使用滚动框。适当分页（如封面/歌词的分页），不把内容挤在同一页面而被迫使用滚动框。
    - 页面切换灵活不死板，有流畅适当的动画。对于底部、居中模态框注意是否规范，并且类似元素使用时不割裂，确保设计语言统一和谐。
    - https://github.com/PixelPlayerHQ/PixelPlayer可以简单参考一下截图，毕竟Kotlin项目没法直接照搬。
- 页面框架
  - 菜单：手机底部菜单；电脑侧边栏；只有一级页面常驻。
  - 搜索（即首页）
    - 只有搜索框和折行堆叠的搜索历史记录，搜索框上方显示“Melody”的标题（后续我们再谈论如何让它更生动或更多样化）。
    - 当发起搜索时，搜索框上浮，下方显示搜索结果（此时底部菜单栏隐藏，搜索框左边有返回键）。 
    # 所有二级页面都会使底部菜单栏隐藏，这时必须要有一个返回键。需要注意的是，电脑端不会隐藏菜单栏（因为它在侧边，点击之后只会回到一级页面）
      - 如果搜索提供歌手歌曲名同时搜索，则需要分成歌曲和歌手两栏（看看匹配的是哪一方）
      - 合并来源不同但相同歌名、歌手的歌曲（需要注意可能不同来源的格式不同），播放实际使用用用户设置的回退顺序获取。
      - 项目可以直接加入收藏或移动到分组。单击歌曲项目立即播放，播放时在底部显示悬浮卡片。 # 悬浮卡片具体特性见下方，实际上和正常的音乐软件差不多。
      - 歌曲不一次性全部加载，先预先加载一部分。封面懒加载，暂时没有加载或没有封面的音乐使用图标占位（没有则回退源）。
    - 历史记录只显示有点击的（即对搜索结果产生交互的）搜索词。
  - 曲库
    - 理所当然的系统歌单：最近播放、我的喜欢、我的缓存。
    - 关于缓存：用户手动发起的缓存。缓存的音乐存储在浏览器内部，保证它们被持久保存。
    - 关于下载：将缓存的音乐取出，以文件形式下载到本地（可以选择音频格式，可以编辑文件元数据，默认自带封面），可以选择下载歌词文件。
    - 自定义歌单。
  - 我的
    - 个人资料（用于区分档案，可以填写自己的名字，便于导出配置和其它数据） # 展示为一个资料卡片，可以单击进入编辑页。可以上传头像。
    # 注：本应用暂时为离线应用（对于用户数据而言），所有的数据都是存在浏览器中的，并保证它们能够持久存储。
    - 主题配色：自定义或使用多组预设。
    - 偏好设置：一些其它改善体验的可选项（我们在开发过程中拿不准的效果）。
    - 来源设置：可以启用或禁用来源，可以调整回退顺序。
    - 任务进度：缓存进度（先缓存才能下载，把缓存保存到本地本来就是一瞬间的事），显示任务数量数字圆点。
    - 其它杂项
    - 数据管理：导入/导出数据（以文件或文本形式），清理临时缓存（不是手动发起的持久存储）/恢复默认配置/清空全部数据。
    - 关于页面。
