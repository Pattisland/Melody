name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # GitHub 的 artifact 元数据有延迟，deploy-pages 偶尔会读到 0 个 artifact。
      # 传完后稍等一下，避开这个抖动。
      - name: Wait for artifact
        run: sleep 10
      - id: deployment
        uses: actions/deploy-pages@v4
